version: '3.8'

services:
  # 1. База данных: PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: libr4-ide-db
    environment:
      POSTGRES_USER: libr4_user
      POSTGRES_PASSWORD: libr4_password
      POSTGRES_DB: libr4_ide
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libr4_user -d libr4_ide"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Rust Sandbox API (The Muscle)
  sandbox-api:
    build:
      context: .
      dockerfile: ./obscura/Dockerfile
    container_name: libr4-rust-sandbox
    environment:
      - RUST_LOG=info
    ports:
      - "50051:50051" # gRPC
      - "9091:9091"   # Metrics for Prometheus
    depends_on:
      - db

  # 3. C# / F# IDE Service (The Brain)
  ide-service:
    build:
      context: .
      dockerfile: ./src/Services/IDE/Libr4.IDE.Api/Dockerfile
    container_name: libr4-csharp-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=libr4_ide;Username=libr4_user;Password=libr4_password
      - RustSandboxUrl=http://sandbox-api:50051
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy
      sandbox-api:
        condition: service_started

  # 4. Мониторинг: Prometheus (Collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: libr4-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # 5. Мониторинг: Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: libr4-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

networks:
  default:
    name: libr4-ide-network
