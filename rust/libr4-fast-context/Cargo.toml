[package]
name = "libr4-fast-context"
version = "0.1.0"
edition = "2021"

[lib]
name = "libr4_fast_context"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "libr4-fast-context-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
