[package]
name = "libr4-crawler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "libr4-crawler"
path = "src/main.rs"

[dependencies]
# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "gzip"] }

# HTML parsing
scraper = "0.21"

# Rate limiting
governor = "0.6"
nonzero_lit = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
regex = "1"
rand = "0.8"
futures = "0.3"

# Workspace shared
libr4-shared = { path = "../shared" }

[build-dependencies]
tonic-build = "0.12"
