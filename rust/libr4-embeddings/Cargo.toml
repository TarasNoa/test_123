[package]
name = "libr4-embeddings"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "libr4-embeddings"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# ONNX Runtime
ort = { version = "2.0", features = ["load-dynamic"] }

# HuggingFace tokenizers
tokenizers = "0.20"

# ndarray for tensor operations
ndarray = "0.16"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

libr4-shared = { path = "../shared" }

[build-dependencies]
tonic-build = "0.12"
