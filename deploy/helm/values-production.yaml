global:
  environment: production
  image:
    tag: latest
  
  jwt:
    authority: "https://libr4.io"

# Infrastructure - Production sizing
postgresql:
  auth:
    postgresPassword: "" # Set via external secret
  primary:
    persistence:
      size: 100Gi
    resources:
      limits:
        memory: 4Gi
        cpu: 2
  readReplicas:
    replicaCount: 2
    persistence:
      size: 100Gi

redis:
  architecture: replication
  auth:
    enabled: true
    password: "" # Set via external secret
  master:
    persistence:
      size: 20Gi
    resources:
      limits:
        memory: 2Gi
        cpu: 1
  replica:
    replicaCount: 2
    persistence:
      size: 20Gi

rabbitmq:
  replicaCount: 3
  persistence:
    size: 50Gi

# Services - Production sizing
services:
  gateway:
    replicaCount: 3
    ingress:
      enabled: true
      className: nginx
      host: libr4.io
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCPUUtilizationPercentage: 60
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi

  auth:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi

  tasks:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi

  payments:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi

  chat:
    replicaCount: 5
    resources:
      limits:
        cpu: 2000m
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 5
      maxReplicas: 50

  trading:
    replicaCount: 3
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi

  ai:
    replicaCount: 5
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
    hpa:
      enabled: true
      minReplicas: 5
      maxReplicas: 20

# Full monitoring stack
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
