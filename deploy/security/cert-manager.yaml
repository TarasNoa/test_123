apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager

---
# cert-manager CRDs (installed via Helm)
# helm install cert-manager jetstack/cert-manager --namespace cert-manager --set installCRDs=true

---
# ClusterIssuer for Let's Encrypt staging
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@libr4.io
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: nginx
      - dns01:
          azureDNS:
            clientID: ${AZURE_CLIENT_ID}
            clientSecretSecretRef:
              name: azuredns-config
              key: client-secret
            subscriptionID: ${AZURE_SUBSCRIPTION_ID}
            tenantID: ${AZURE_TENANT_ID}
            resourceGroupName: libr4-dns
            hostedZoneName: libr4.io

---
# ClusterIssuer for Let's Encrypt production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@libr4.io
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
        selector:
          dnsZones:
            - "staging.libr4.io"
      - dns01:
          azureDNS:
            clientID: ${AZURE_CLIENT_ID}
            clientSecretSecretRef:
              name: azuredns-config
              key: client-secret
            subscriptionID: ${AZURE_SUBSCRIPTION_ID}
            tenantID: ${AZURE_TENANT_ID}
            resourceGroupName: libr4-dns
            hostedZoneName: libr4.io
        selector:
          dnsZones:
            - "libr4.io"

---
# TLS Certificate for Libr4
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: libr4-tls
  namespace: libr4-production
spec:
  secretName: libr4-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - libr4.io
    - "*.libr4.io"
    - api.libr4.io
    - ws.libr4.io
    - ai.libr4.io

---
# TLS Certificate for Staging
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: libr4-staging-tls
  namespace: libr4-staging
spec:
  secretName: libr4-staging-tls-secret
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - staging.libr4.io
    - "*.staging.libr4.io"
