name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Deploy with Helm
        run: |
          export KUBECONFIG=kubeconfig.yaml
          helm upgrade --install libr4 ./deploy/helm/libr4 \
            --namespace libr4-${{ github.event.inputs.environment }} \
            --create-namespace \
            --set global.image.tag=${{ github.event.inputs.tag }} \
            --set global.image.registry=${{ env.REGISTRY }}/${{ github.repository }} \
            --values ./deploy/helm/values-${{ github.event.inputs.environment }}.yaml \
            --wait --timeout 10m

      - name: Verify deployment
        run: |
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout status deployment/libr4-gateway -n libr4-${{ github.event.inputs.environment }}
          kubectl get pods -n libr4-${{ github.event.inputs.environment }}

      - name: Cleanup
        if: always()
        run: rm -f kubeconfig.yaml
