name: Build and Push

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (all/auth/tasks/payments/chat/trading/ai/gateway)'
        required: true
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # Build matrix for all services
  build-services:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth
            context: .
            dockerfile: src/Services/Auth/Libr4.Auth.Api/Dockerfile
            project: src/Services/Auth/Libr4.Auth.Api/Libr4.Auth.Api.csproj
          - name: tasks
            context: .
            dockerfile: src/Services/Tasks/Libr4.Tasks.Api/Dockerfile
            project: src/Services/Tasks/Libr4.Tasks.Api/Libr4.Tasks.Api.csproj
          - name: payments
            context: .
            dockerfile: src/Services/Payments/Libr4.Payments.Api/Dockerfile
            project: src/Services/Payments/Libr4.Payments.Api/Libr4.Payments.Api.csproj
          - name: chat
            context: .
            dockerfile: src/Services/Chat/Libr4.Chat.Api/Dockerfile
            project: src/Services/Chat/Libr4.Chat.Api/Libr4.Chat.Api.csproj
          - name: trading
            context: .
            dockerfile: src/Services/Trading/Libr4.Trading.Api/Dockerfile
            project: src/Services/Trading/Libr4.Trading.Api/Libr4.Trading.Api.csproj
          - name: ai
            context: .
            dockerfile: src/Services/AI/Libr4.AI.Api/Dockerfile
            project: src/Services/AI/Libr4.AI.Api/Libr4.AI.Api.csproj
          - name: gateway
            context: .
            dockerfile: src/Gateway/Libr4.Gateway/Dockerfile
            project: src/Gateway/Libr4.Gateway/Libr4.Gateway.csproj
          - name: frontend
            context: frontend
            dockerfile: Dockerfile
            project: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-services
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        service: [auth, tasks, payments, chat, trading, ai, gateway, frontend]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ matrix.service }}
