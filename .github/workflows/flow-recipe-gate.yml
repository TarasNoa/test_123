name: Flow Recipe Gate

on:
  pull_request:
    paths:
      - "src/Services/IDE/Libr4.IDE.AutonomousAppGeneration/Flows/**"
      - "src/Services/IDE/Libr4.IDE.AutonomousAppGeneration/AutonomousAppGeneration/Tooling/Flow/**"
      - "tests/Libr4.IntegrationTests/IDE/FlowRecipeRegressionTests.cs"
      - ".github/workflows/flow-recipe-gate.yml"
  workflow_dispatch:

jobs:
  flow-recipe-regression:
    name: Flow recipe CI regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore tests/Libr4.IntegrationTests/Libr4.IntegrationTests.csproj
      - name: Run flow recipe regression tests
        run: dotnet test tests/Libr4.IntegrationTests/Libr4.IntegrationTests.csproj --configuration Release --filter "FullyQualifiedName~FlowRecipeRegressionTests" --verbosity normal
