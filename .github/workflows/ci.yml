name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore libr4.sln
      - name: Build
        run: dotnet build libr4.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test libr4.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (SolidJS + Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build

  rust:
    name: Rust (Sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build
        run: cargo build --manifest-path=obscura/Cargo.toml --release
      - name: Test
        run: cargo test --manifest-path=obscura/Cargo.toml --release
