name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      major: ${{ steps.get_version.outputs.major }}
      minor: ${{ steps.get_version.outputs.minor }}
    steps:
      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo $VERSION | cut -d. -f1,2)" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-release:
    name: Build Release Images
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, tasks, payments, chat, trading, ai, gateway, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Services/${{ matrix.service == 'gateway' && 'Gateway' || matrix.service == 'frontend' && 'frontend' || format('Services/{0}/Libr4.{1}.Api/Dockerfile', matrix.service, matrix.service) }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.version.outputs.major }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.version.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [version, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s" > CHANGELOG.md
          else
            git log --pretty=format:"- %s" $LAST_TAG..HEAD > CHANGELOG.md
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.version.outputs.version }}
          release_name: Release v${{ needs.version.outputs.version }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ## Docker Images
            ```
            ${{ env.IMAGE_PREFIX }}/auth:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/tasks:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/payments:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/chat:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/trading:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/ai:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/gateway:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ needs.version.outputs.version }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  update-helm:
    name: Update Helm Values
    needs: [version, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Helm values
        run: |
          sed -i "s/tag: .*/tag: ${{ needs.version.outputs.version }}/g" deploy/helm/values-production.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deploy/helm/values-production.yaml
          git commit -m "chore: bump production image tag to ${{ needs.version.outputs.version }}"
          git push || echo "No changes to commit"
