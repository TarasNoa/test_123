name: libr4

include:
  - docker-compose.infra.yml

services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Libr4.Gateway/Dockerfile
    container_name: libr4-gateway
    depends_on:
      auth-api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__auth__Destinations__d1__Address: http://auth-api:8080/
      ReverseProxy__Clusters__tasks__Destinations__d1__Address: http://tasks-api:8080/
      ReverseProxy__Clusters__payments__Destinations__d1__Address: http://payments-api:8080/
      ReverseProxy__Clusters__chat__Destinations__d1__Address: http://chat-api:8080/
      ReverseProxy__Clusters__social__Destinations__d1__Address: http://social-api:8080/
      ReverseProxy__Clusters__analytics__Destinations__d1__Address: http://analytics-api:8080/
      ReverseProxy__Clusters__collaboration__Destinations__d1__Address: http://collaboration-api:8080/
      ReverseProxy__Clusters__trading__Destinations__d1__Address: http://trading-api:8080/
      ReverseProxy__Clusters__ide__Destinations__d1__Address: http://ide-api:8080/
      ReverseProxy__Routes__ide-terminal-ws__ClusterId: ide
      ReverseProxy__Routes__ide-terminal-ws__Match__Path: /ws/terminal/{**catch-all}
      ReverseProxy__Routes__ide-terminal-ws__Metadata__HttpVersionPolicy: RequestVersionExact
      ReverseProxy__Routes__ide-events-ws__ClusterId: ide
      ReverseProxy__Routes__ide-events-ws__Match__Path: /ws/events/{**catch-all}
      ReverseProxy__Routes__ide-events-ws__Metadata__HttpVersionPolicy: RequestVersionExact
      ReverseProxy__Clusters__matching__Destinations__d1__Address: http://matching-api:8080/
      ReverseProxy__Clusters__ai__Destinations__d1__Address: http://ai-api:8080/
      ReverseProxy__Routes__users__ClusterId: auth
      ReverseProxy__Routes__users__Match__Path: /api/v1/users/{**catch-all}
      ReverseProxy__Routes__verification__ClusterId: auth
      ReverseProxy__Routes__verification__Match__Path: /api/v1/verification/{**catch-all}
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth-api:
    build:
      context: .
      dockerfile: src/Services/Auth/Libr4.Auth.Api/Dockerfile
    container_name: libr4-auth-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_auth;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Issuer: ${JWT_ISSUER:-libr4}
      Jwt__Audience: ${JWT_AUDIENCE:-libr4-clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-super-secret-change-me-to-random-64-bytes-dev-super-secret-change-me}
    ports:
      - "5001:8080"
    volumes:
      - auth_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: src/Frontend/Dockerfile
    container_name: libr4-frontend
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "3000:3000"


  ide-api:
    build:
      context: .
      dockerfile: src/Services/IDE/Libr4.IDE.Api/Dockerfile
    container_name: libr4-ide-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=libr4_ide;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_ai;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Issuer: ${JWT_ISSUER:-libr4}
      Jwt__Audience: ${JWT_AUDIENCE:-libr4-clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-super-secret-change-me-to-random-64-bytes-dev-super-secret-change-me}
      AI__OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-sk-or-dummy-key-for-dev}
      AI__OpenRouter__Endpoint: ${OPENROUTER_ENDPOINT:-https://openrouter.ai/api/v1}
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://frontend:3000
    ports:
      - "5005:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - libr4-shadow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tasks-api:
    build:
      context: .
      dockerfile: src/Services/Tasks/Libr4.Tasks.Api/Dockerfile
    container_name: libr4-tasks-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_tasks;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://gateway:8080
      Jwt__Audience: libr4-clients
    ports:
      - "5002:8080"

  payments-api:
    build:
      context: .
      dockerfile: src/Services/Payments/Libr4.Payments.Api/Dockerfile
    container_name: libr4-payments-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_payments;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      Jwt__Authority: http://gateway:8080
      Jwt__Audience: libr4-clients
    ports:
      - "5003:8080"

  chat-api:
    build:
      context: .
      dockerfile: src/Services/Chat/Libr4.Chat.Api/Dockerfile
    container_name: libr4-chat-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_chat;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      S3__Endpoint: http://minio:9000
      S3__AccessKey: ${MINIO_ACCESS_KEY:-minioadmin}
      S3__SecretKey: ${MINIO_SECRET_KEY:-minioadmin}
      S3__Bucket: libr4-files
      Jwt__Authority: http://gateway:8080
      Jwt__Audience: libr4-clients
    ports:
      - "5004:8080"

  social-api:
    build:
      context: .
      dockerfile: src/Services/Social/Libr4.Social.Api/Dockerfile
    container_name: libr4-social-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_social;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://gateway:8080
      Jwt__Audience: libr4-clients
    ports:
      - "5013:8080"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics-api:
    build:
      context: .
      dockerfile: src/Services/Analytics/Libr4.Analytics.Api/Dockerfile
    container_name: libr4-analytics-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_analytics;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://gateway:8080
      Jwt__Audience: libr4-clients
    ports:
      - "5014:8080"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  collaboration-api:
    build:
      context: .
      dockerfile: src/Services/Collaboration/Libr4.Collaboration.Api/Dockerfile
    container_name: libr4-collaboration-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_collaboration;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://gateway:8080
      Jwt__Audience: libr4-clients
    ports:
      - "5015:8080"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  trading-api:
    build:
      context: .
      dockerfile: src/Services/Trading/Libr4.Trading.Api/Dockerfile
    container_name: libr4-trading-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_trading;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://gateway:8080
      Jwt__Audience: libr4-clients
    ports:
      - "5009:8080"

  ai-api:
    build:
      context: .
      dockerfile: src/Services/AI/Libr4.AI.Api/Dockerfile
    container_name: libr4-ai-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=libr4_ai;Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Ollama__BaseUrl: ${OLLAMA_URL:-http://ollama:11434}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Jwt__Authority: http://gateway:8080
      Jwt__Audience: libr4-clients
    ports:
      - "5006:8080"

  # Ollama for local LLM inference (Qwen3-Coder-Next, Qwen3-8B, etc.)
  ollama:
    image: ollama/ollama:latest
    container_name: libr4-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=3
    # GPU support (optional, for faster inference)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Pre-configure Ollama with recommended models
  ollama-setup:
    image: ollama/ollama:latest
    container_name: libr4-ollama-setup
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        sleep 10 &&
        echo 'Pulling recommended models...' &&
        ollama pull nomic-embed-text &&
        ollama pull nomic-embed-text &&
        ollama pull qwen3-coder-next &&
        ollama pull qwen3:8b &&
        ollama pull stable-code:3b-code &&
        echo 'Models ready!'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    profiles:
      - setup

  # Rust Shadow Sync Service - High-performance file sync for Shadow Workspace
  shadow-sync:
    build:
      context: ./obscura
      dockerfile: crates/shadow-sync/Dockerfile
    container_name: libr4-shadow-sync
    restart: unless-stopped
    depends_on:
      - ide-api
    environment:
      SHADOW_SYNC_SOURCE: /workspace/source
      SHADOW_SYNC_TARGET: /workspace/target
      SHADOW_SYNC_WORKSPACE_ID: default
      SHADOW_SYNC_DEBOUNCE_MS: 50
    ports:
      - "8080:8080"  # API port
    volumes:
      - workspace_source:/workspace/source
      - workspace_target:/workspace/target


  # Rust Sandbox Controller - Resource monitoring and kill switch
  sandbox-controller:
    build:
      context: ./obscura
      dockerfile: crates/sandbox-controller/Dockerfile
    container_name: libr4-sandbox-controller
    restart: unless-stopped
    privileged: true  # Required for container monitoring
    depends_on:
      - docker-socket
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
    ports:
      - "9090:9090"  # API port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro


  # Docker socket proxy for security (optional, for production)
  docker-socket:
    image: tecnativa/docker-socket-proxy:latest
    container_name: libr4-docker-socket
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: 1
      POST: 0


  # Rust Security Scanner - Autonomous offensive security
  security-scanner:
    build:
      context: ./obscura
      dockerfile: crates/security-scanner/Dockerfile
    container_name: libr4-security-scanner
    restart: unless-stopped
    depends_on:
      - ide-api
      - sandbox-controller
    environment:
      RUST_LOG: info
      SCAN_TIMEOUT_SECS: 30
    ports:
      - "7070:7070"  # API port


  # Rust Binary Archeology - Legacy code migration
  binary-archeology:
    build:
      context: ./obscura
      dockerfile: crates/binary-archeology/Dockerfile
    container_name: libr4-binary-archeology
    restart: unless-stopped
    environment:
      RUST_LOG: info
    ports:
      - "6060:6060"  # API port
    volumes:
      - binary_uploads:/uploads

  # Upstream Obscura CDP service (GitHub: h4ckf0r0day/obscura)
  obscura:
    build:
      context: ./obscura
      dockerfile: Dockerfile
    container_name: libr4-obscura
    restart: unless-stopped
    command: ["obscura", "serve", "--port", "9222"]
    ports:
      - "9222:9222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9222 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5


  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: libr4-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334


  rust-embeddings:
    build:
      context: .
      dockerfile: rust/libr4-embeddings/Dockerfile
    container_name: libr4-rust-embeddings
    ports:
      - "50061:50061"
    environment:
      RUST_LOG: info
      GRPC_PORT: "50061"
      DMR_URL: ${DMR_URL:-http://host.docker.internal:12434/engines/v1}
      DMR_EMBEDDING_MODEL: ${DMR_EMBEDDING_MODEL:-docker.io/ai/nomic-embed-text:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50061 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  rust-crawler:
    build:
      context: .
      dockerfile: rust/libr4-crawler/Dockerfile
    container_name: libr4-rust-crawler
    ports:
      - "50060:50060"
    environment:
      RUST_LOG: info,libr4_crawler=debug
      GRPC_PORT: "50060"

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50060 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  matching-api:
    build:
      context: .
      dockerfile: src/Services/Matching/Libr4.Matching.Api/Dockerfile
    container_name: libr4-matching-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      rust-embeddings:
        condition: service_started
      rust-crawler:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: >-
        Host=postgres;Database=libr4_matching;
        Username=${POSTGRES_USER:-libr4};Password=${POSTGRES_PASSWORD:-libr4_dev_password}
      ConnectionStrings__Redis: redis:6379
      Grpc__EmbeddingsUrl: http://rust-embeddings:50061
      Grpc__CrawlerUrl: http://rust-crawler:50060
      Qdrant__Host: qdrant
      Qdrant__Port: "6333"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5010:8080"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ollamadata:
  workspace_source:
  workspace_target:
  binary_uploads:
  auth_uploads:
  qdrant_data:

networks:
  libr4-shadow-network:
    driver: bridge
    name: libr4-shadow-network

