id: react-counter-button
stack: react-components
style: humaneval
prompt: |
  Write a React CounterButton component using useState to increment count on click.
solution: |
  import { useState } from "react";

  export function CounterButton() {
    const [count, setCount] = useState(0);
    return <button onClick={() => setCount(count + 1)}>{count}</button>;
  }
requiredPatterns:
  - "CounterButton"
  - "useState"
  - "setCount"
forbiddenPatterns:
  - "document.write"
