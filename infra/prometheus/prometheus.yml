global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: libr4-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000']

  - job_name: libr4-auth
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5001']

  - job_name: libr4-tasks
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5002']

  - job_name: libr4-payments
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5003']

  - job_name: libr4-chat
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5004']

  - job_name: libr4-trading
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5005']

  - job_name: libr4-ai
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5006']
